<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title></title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="page">
    <header class="site-header">
      <h1 class="app-name" id="app-name"></h1>
      <button class="lang-switch" id="lang-switch" type="button"></button>
    </header>

    <main class="content">
      <section class="prompt-panel" aria-label="Impuls">
        <p class="date-label" id="date-label"></p>
        <ul class="prompt-list" id="prompt-list"></ul>
      </section>
    </main>

    <footer class="site-footer">
      <p class="tagline" id="tagline"></p>
      <p class="countdown" id="countdown"></p>
    </footer>
  </div>

  <button class="day-nav day-nav--back" id="nav-back" type="button">
    <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <polyline points="15 18 9 12 15 6"></polyline>
    </svg>
  </button>

  <button class="day-nav day-nav--forward" id="nav-forward" type="button" hidden>
    <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <polyline points="9 6 15 12 9 18"></polyline>
    </svg>
  </button>

  <button class="fab" id="done-button" type="button" aria-pressed="false">
    <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <polyline points="4 12 10 18 20 6"></polyline>
    </svg>
  </button>

  <div id="particle-layer" aria-hidden="true"></div>

  <script src="data.js"></script>
  <script src="draw.js"></script>
  <script src="app.js"></script>
</body>
</html>
